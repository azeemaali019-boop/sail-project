<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="pp.css">
  <!-- <meta charset="UTF-8" /> -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"/> -->
  <title>SAIL Login Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to right, #003366, #0059b3);
    }

    .container {
      width: 900px;
      height: 550px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
    }

    .left-panel {
      width: 50%;
      background: #003366;
      color: white;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .left-panel h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .left-panel h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .left-panel p {
      font-size: 16px;
      line-height: 1.6;
      color: #d9e6f2;
    }

    .logo-circle {
      width: 150px;
      height: 150px;
      background: #0059b3;
      border-radius: 50%;
      margin-top: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 60px;
      font-weight: bold;
    }

    .right-panel {
      width: 50%;
      padding: 60px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .right-panel h2 {
      font-size: 32px;
      color: #333;
      margin-bottom: 10px;
    }

    .right-panel p {
      color: gray;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-weight: bold;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #0059b3;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .options a {
      text-decoration: none;
      color: #0059b3;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      background: #0059b3;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: #004080;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: gray;
      font-size: 13px;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        width: 95%;
        height: auto;
      }

      .left-panel,
      .right-panel {
        width: 100%;
      }

      .left-panel {
        padding: 30px;
      }

      .right-panel {
        padding: 40px 30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="left-panel">
      <h1>SAIL</h1>

      <h2>Sales Flow & Financial Tracking System</h2>

      <p>
        Monitor dealer purchases, distributor sales,
        inventory flow, and financial transactions
        across the SAIL distribution network.
      </p>

      <div class="logo-circle" >
       <img src="SAIL_Logo.png" alt="logo-circle">
      </div>
    </div>

    <div class="right-panel">

      <h2>Welcome to SAIL
        
      </h2>

      <p>Login to continue to dashboard</p>

      <form id="loginForm" action="dashboard.html" method="get">

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Enter your password" required>
        </div>

        <div class="form-group">
          <label>Login Role</label>

          <select>
            <option>SAIL Admin</option>
            <option>Dealer</option>
            <option>Distributor</option>
          </select>
        </div>

        <div class="options">
          <label>
            <input type="checkbox"> Remember Me
          </label>

          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">
          Login
        </button>

      </form>

      <div class="footer">
        © 2026 SAIL Financial Tracking System
      </div>

    </div>

  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', () => {
        localStorage.setItem('loggedIn', 'true');
      });
    }
  </script>
</body>
</html>
