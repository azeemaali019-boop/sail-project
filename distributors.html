<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAIL Distributors</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body data-page="distributors">
<div class="container">
  <div class="sidebar">
    <h2>SAIL</h2>
    <ul>
      <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      <li><a href="dealer.html" class="nav-link">Dealers</a></li>
      <li><a href="distributors.html" class="nav-link">Distributors</a></li>
      <li><a href="inventory.html" class="nav-link">Inventory</a></li>
      <li><a href="financial.html" class="nav-link">Financial Ledger</a></li>
      <li><a href="reports.html" class="nav-link">Reports</a></li>
      <li><a href="form.html" class="nav-link">Logout</a></li>
    </ul>
  </div>
  <div class="main-content">
    <div class="topbar">
      <h1>Distributor Management</h1>
      <div class="profile" id="profileLabel">Admin</div>
    </div>
    <div class="table-section">
      <div class="page-header">
        <h2>Distributors Overview</h2>
        <div class="action-group">
          <button id="exportBtn" class="btn-secondary">Export CSV</button>
          <button class="btn-primary" onclick="location.href='dealer.html'">Add Distributor</button>
        </div>
      </div>
      <div class="stats-container">
        <div class="stat-card">
          <div class="stat-icon">📦</div>
          <div class="stat-info">
            <h3>Total Distributors</h3>
            <p id="totalDistributors">-</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <div class="stat-info">
            <h3>Active</h3>
            <p id="activeDistributors">-</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📈</div>
          <div class="stat-info">
            <h3>Top Performer</h3>
            <p id="topDistributor">-</p>
          </div>
        </div>
      </div>

      <div class="search-filter-bar">
        <div class="search-box"><i class="fa fa-search"></i><input id="searchInput" placeholder="Search name or location"></div>
        <div class="filter-group">
          <select id="statusFilter">
            <option value="all">All Status</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>

      <div class="innovative-table">
        <table>
          <thead>
            <tr><th>S.No</th><th>Name</th><th>Contact</th><th>Location</th><th>Status</th></tr>
          </thead>
          <tbody id="distributorTableBody">
            <tr><td colspan="4" style="text-align:center;padding:30px;color:#94a3b8;">Loading…</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="auth.js"></script>
<script src="app_api.js"></script>
<script>
  var role = localStorage.getItem('userRole');
  if (role) document.getElementById('profileLabel').textContent = role;
</script>
</body>
</html>
